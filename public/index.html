<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Sprint - Отчёты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .open-btn {
            padding: 14px 28px;
            font-size: 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

            .open-btn:hover {
                background: #0056b3;
                transform: scale(1.02);
            }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

            .modal-close:hover {
                color: #000;
            }

        .modal-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-right: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

            input:focus, textarea:focus {
                outline: none;
                border-color: #007bff;
            }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
        }

        .file-zone {
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
        }

            .file-zone:hover {
                background: #f0f0f0;
            }

        .file-name {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

            .submit-btn:hover {
                background: #0056b3;
            }

        .success {
            text-align: center;
            padding: 20px;
        }

        .success-icon {
            width: 60px;
            height: 60px;
            background: #28a745;
            color: white;
            font-size: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .reset-btn {
            background: none;
            border: 1px solid #007bff;
            color: #007bff;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Компонент Textarea
        function Textarea({ label, value, onChange, placeholder, error }) {
        return React.createElement('div', { className: 'form-group' },
        React.createElement('label', {}, label),
        React.createElement('textarea', { value, onChange: (e) => onChange(e.target.value), placeholder, rows: 4 }),
        error && React.createElement('div', { className: 'error' }, error)
        );
        }

        // Компонент Modal
        function Modal({ isOpen, onClose, title, children }) {
        if (!isOpen) return null;
        return React.createElement('div', { className: 'modal-overlay', onClick: onClose },
        React.createElement('div', { className: 'modal', onClick: (e) => e.stopPropagation() },
        React.createElement('button', { className: 'modal-close', onClick: onClose }, '×'),
        React.createElement('div', { className: 'modal-title' }, title),
        children
        )
        );
        }

        // Главный компонент App
        function App() {
        const [isOpen, setIsOpen] = React.useState(false);
        const [title, setTitle] = React.useState('');
        const [description, setDescription] = React.useState('');
        const [plans, setPlans] = React.useState('');
        const [file, setFile] = React.useState(null);
        const [errors, setErrors] = React.useState({});
        const [submitted, setSubmitted] = React.useState(false);

        const validate = () => {
        const newErrors = {};
        if (!title.trim()) newErrors.title = 'Заголовок обязателен';
        if (!description.trim()) newErrors.description = 'Описание работы обязательно';
        if (!plans.trim()) newErrors.plans = 'Будущие планы обязательны';
        if (!file) newErrors.file = 'Прикрепите файл';
        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
        };

        const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0]) {
        setFile(e.target.files[0]);
        if (errors.file) setErrors({ ...errors, file: '' });
        }
        };

        const handleSubmit = () => {
        if (validate()) {
        setSubmitted(true);
        console.log('Отправлено:', { title, description, plans, fileName: file?.name });
        }
        };

        if (submitted) {
        return React.createElement('div', { className: 'success' },
        React.createElement('div', { className: 'success-icon' }, '✓'),
        React.createElement('h3', {}, 'Отчёт отправлен!'),
        React.createElement('p', {}, 'Спасибо, ваш отчёт успешно отправлен.'),
        React.createElement('button', { className: 'reset-btn', onClick: () => { setSubmitted(false); setTitle(''); setDescription(''); setPlans(''); setFile(null); setErrors({}); } }, 'Отправить ещё')
        );
        }

        return React.createElement('div', { style: { display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '100vh' } },
        React.createElement('button', { className: 'open-btn', onClick: () => setIsOpen(true) }, 'Добавить отчёт'),
        React.createElement(Modal, { isOpen, onClose: () => setIsOpen(false), title: 'Добавление отчёта' },
        React.createElement('div', {},
        React.createElement('div', { className: 'form-group' },
        React.createElement('input', { type: 'text', placeholder: 'Заголовок', value: title, onChange: (e) => setTitle(e.target.value) }),
        errors.title && React.createElement('div', { className: 'error' }, errors.title)
        ),
        React.createElement(Textarea, { label: 'Описание работы', value: description, onChange: setDescription, placeholder: 'Напишите интересные факты, основную информацию', error: errors.description }),
        React.createElement(Textarea, { label: 'Будущие планы', value: plans, onChange: setPlans, placeholder: 'Опишите перспективы отчёта', error: errors.plans }),
        React.createElement('div', { className: 'form-group' },
        React.createElement('label', {}, 'Добавить файлы'),
        React.createElement('div', { className: 'file-zone', onClick: () => document.getElementById('file-input').click() },
        React.createElement('span', {}, '📎 Нажмите для загрузки файлов'),
        React.createElement('input', { id: 'file-input', type: 'file', style: { display: 'none' }, onChange: handleFileChange, accept: '.svg,.jpg,.png,.pdf,.docx' })
        ),
        file && React.createElement('div', { className: 'file-name' }, `📄 ${file.name}`),
        React.createElement('div', { style: { fontSize: '11px', color: '#888', marginTop: '8px' } }, 'Поддерживаемые форматы: SVG, JPG, PNG, PDF, DOCX (до 20 МБ)'),
        errors.file && React.createElement('div', { className: 'error' }, errors.file)
        ),
        React.createElement('button', { className: 'submit-btn', onClick: handleSubmit }, 'ОТПРАВИТЬ')
        )
        )
        );
        }

        // Рендер приложения
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>

    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
</body>
</html>
